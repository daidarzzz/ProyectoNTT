<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card glass-strong">
    <div class="auth-header">
      <div class="auth-icon">
        <mat-icon>login</mat-icon>
      </div>
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Accede a tu cuenta de LearnHub</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label class="input-label">Email</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">email</mat-icon>
          <input
            class="glass-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="tu@email.com"
            required
            pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}"
            #emailInput="ngModel"
          >
        </div>
        @if (emailInput.invalid && emailInput.touched) {
          <span class="input-error">Ingresa un email válido</span>
        }
      </div>

      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock</mat-icon>
          <input
            class="glass-input"
            [type]="hidePassword ? 'password' : 'text'"
            [(ngModel)]="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
            #passInput="ngModel"
          >
          <button type="button" class="toggle-pass" (click)="hidePassword = !hidePassword" tabindex="-1">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-glass-primary auth-submit" [disabled]="!email || !password">
        <mat-icon>login</mat-icon>
        Acceder
      </button>
    </form>

    <p class="auth-switch">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
